
spring.application.name=BIAT Data Assistant

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:biat_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Toutes les entités lazy (User/Chat/Module) sont résolues dans la couche @Transactional service,
# jamais pendant la sérialisation JSON : la session Hibernate n'a pas besoin de rester ouverte jusqu'à la vue.
spring.jpa.open-in-view=false

server.port=8080

# Spring AI - Ollama (modèle exécuté en local, gratuit, aucune clé API requise)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.2
# Garde le modèle chargé 30 min après la dernière question (défaut Ollama : 5 min). Mesuré le 2026-10-06 :
# un rechargement coûte 19 à 25 s sur ce poste, ajoutés à la première question après une pause.
# llama3.2:3b (2 Go) a aussi été mesuré ce jour-là : 4 à 6x plus rapide mais réponses non fidèles (fonction
# inventée quand l'aide est absente, combinaisons de codes fausses) → llama3 conservé.
spring.ai.ollama.chat.options.keep-alive=30m
# Fenêtre de contexte (en tokens) envoyée au modèle : le contexte T24 (module + table + champs XML) peut être long
spring.ai.ollama.chat.options.num-ctx=8192
# Plafond de tokens générés : le prompt (buildPrompt) demande déjà une réponse courte (5 à 10
# lignes), mais Llama3 peut ignorer cette consigne sur certaines questions et générer un pavé de
# plusieurs dizaines de secondes. Ce plafond borne le pire cas indépendamment du respect du prompt
# par le modèle (~350 tokens ≈ 15-20 lignes, large marge au-dessus de la consigne).
#
# Testé à 200 pour viser <30s (demande explicite) : sur ce poste, le goulot d'étranglement est
# l'évaluation du prompt, pas la génération (GPU 4 Go insuffisant pour charger tout Llama3 8B en
# VRAM, donc partiellement sur CPU) — mesuré à 53s même avec num-predict=200 et context-top-k=3,
# donc ce levier seul n'atteint pas la cible. Remis à 350 sur décision explicite (accepter le temps
# de réponse actuel plutôt que perdre en complétude sans gagner assez en vitesse) : la seule vraie
# option pour <30s fiable serait un modèle plus petit tenant entièrement en VRAM.
spring.ai.ollama.chat.options.num-predict=350
# Télécharge automatiquement le modèle au démarrage s'il n'est pas déjà présent localement
spring.ai.ollama.init.pull-model-strategy=when_missing

# RAG - embeddings Ollama (mxbai-embed-large) pour la couche vectorielle, jamais OpenAI/cloud.
# Nécessite : ollama pull mxbai-embed-large (téléchargé automatiquement au démarrage sinon, comme llama3).
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.options.model=mxbai-embed-large

# Index vectoriel RAG : fichier de persistance JSON (documents + embeddings) et nombre de
# résultats renvoyés par recherche sémantique. Volontairement hors de src/main/resources (pour ne
# pas déclencher un redémarrage Spring Boot DevTools à chaque sauvegarde de l'index) : chemin
# relatif au répertoire d'exécution (backend/), donc backend/data/vector/index.json par défaut.
rag.vector-store.path=${RAG_VECTOR_STORE_PATH:data/vector/index.json}
# Validé en conditions réelles (RagPipelineManualIT) : Top 5 manquait des résultats pertinents sur
# plusieurs questions ; Top 8 les retrouve sans diluer excessivement le contexte. Un document
# sémantique doit en plus atteindre min-score pour être retenu (une correspondance exacte de table
# n'est jamais filtrée par ce seuil).
rag.vector-store.top-k=${RAG_TOP_K:8}
rag.vector-store.min-score=${RAG_MIN_SCORE:0.58}
# Seuil vectoriel quand la recherche est restreinte au module choisi (filtre appliqué PENDANT la recherche) :
# mesuré sur l'index réel, les passages pertinents d'un module obtiennent ~0.53-0.63 (voir VectorConfig).
rag.vector-store.module-min-score=${RAG_MODULE_MIN_SCORE:0.50}
# Poids du reranking lexical (termes anglais du glossaire fr-en-glossary.properties, ponderes par IDF) ajoute au
# cosinus ; 0 = cosinus seul. Calibre sur l'index reel, voir VectorConfig.lexicalWeight.
rag.vector-store.lexical-weight=${RAG_LEXICAL_WEIGHT:0.20}
# Réconciliation incrémentale de l'index persisté avec HELP_TEXT/HELP_FIELD au démarrage (XML ajoutés/modifiés).
# Mesuré : ~30 s de relecture de la base quand rien n'a changé ; mettre à false si le référentiel est figé.
rag.vector-store.sync-on-startup=${RAG_SYNC_ON_STARTUP:true}
# Distinct de top-k : nombre de documents réellement envoyés à Llama3 après fusion/reranking. Le
# temps de réponse est dominé par l'évaluation du prompt (constaté en conditions réelles : ~8-12s
# même pour une réponse de quelques tokens) — réduire ce nombre réduit directement ce temps, sans
# toucher au rappel de la recherche elle-même (top-k reste large en interne). Testé à 3 avec
# num-predict=200 pour viser <30s (mesuré à 53s, insuffisant) ; remis à 4, voir num-predict ci-dessus.
rag.vector-store.context-top-k=${RAG_CONTEXT_TOP_K:4}

# Durée de vie du cache de réponses complètes (ChatResponseCache), en millisecondes. Une question
# identique/répétée dans cette fenêtre évite entièrement un nouvel appel RAG+Ollama (le cache est
# partagé entre tous les utilisateurs, questions normalisées : casse/espaces ignorés). Portée à
# 30 min (contre 10 min) : sur les questions générales/répétées (ex. "c'est quoi la table X ?"),
# ça élargit la fenêtre où une réponse déjà générée est réutilisée instantanément, sans coût sur
# la qualité (l'entrée expire simplement plus tard, elle n'est jamais moins pertinente).
rag.cache.ttl-ms=${RAG_CACHE_TTL_MS:1800000}

# Taille des lots envoyés à POST /api/embed lors de la construction de l'index : envoyer les ~6900
# documents HELP_TEXT en un seul appel dépasse spring.http.client.read-timeout sur une inférence
# locale Ollama (constaté en conditions réelles : HttpTimeoutException/Request cancelled).
rag.embedding.batch-size=${RAG_EMBEDDING_BATCH_SIZE:100}

# L'inférence locale sur CPU peut être lente (et variable selon la charge machine) : on laisse une
# marge large par rapport aux timeouts HTTP par défaut. Constaté en conditions réelles : une
# question avec un contexte volumineux peut ponctuellement dépasser 300s sur ce poste.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=600s

# Actuator : seul /actuator/health est exposé publiquement (pas env/beans/config, sensibles)
management.endpoints.web.exposure.include=health

# JWT (POST /login) : secret HMAC-SHA256 (>= 32 caractères / 256 bits) et durée de validité du token.
# A surcharger en production via la variable d'environnement JWT_SECRET (ne jamais garder la valeur
# par défaut ci-dessous hors environnement de développement local).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger / OpenAPI (springdoc) : UI sur /swagger-ui.html, spec brute sur /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html