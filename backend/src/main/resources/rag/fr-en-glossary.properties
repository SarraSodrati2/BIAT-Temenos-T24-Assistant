# ============================================================================
# Glossaire francais -> anglais T24 (pont question francaise / documentation anglaise)
# ============================================================================
# Utilise UNIQUEMENT pour enrichir la requete de RECHERCHE (embedding + reranking lexical,
# voir QueryAnalyzerImpl / ConceptReranker) : jamais montre a l'utilisateur, jamais ajoute au
# Contexte envoye a Llama3, jamais utilise comme nom de table pour une correspondance exacte.
#
# Format : mot_francais=terme anglais 1,terme anglais 2
#   - cle : mot francais sans accents (la question est normalisee de la meme facon), au singulier ;
#     les formes plurielles/feminines courantes sont reconnues par le code (suffixes s/x/e/es).
#   - valeurs : termes anglais tels qu'ils apparaissent REELLEMENT dans la documentation T24.
#     Au chargement, tout terme absent de l'index documentaire est ecarte (log WARN) : le glossaire
#     ne peut donc jamais injecter un mot qui n'existe pas dans le referentiel.
#
# Vocabulaire generique bancaire/T24, volontairement limite aux notions courantes ; ce n'est pas
# une traduction exhaustive. Les codes de module (AC, LD...) sont dans business-synonyms.properties.
# ============================================================================

