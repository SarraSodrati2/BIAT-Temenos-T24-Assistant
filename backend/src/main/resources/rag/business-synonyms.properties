# ============================================================================
# Dictionnaire de synonymes metier T24 (BIAT Data Assistant)
# ============================================================================
# Format : CLE=valeur1,valeur2,valeur3
#   - CLE       : acronyme, mot metier ou terme francais que peut employer un
#                 utilisateur (insensible a la casse et aux accents a la lecture).
#                 Si la cle contient plusieurs mots, chaque espace DOIT etre
#                 echappe (CREDIT\ DOCUMENTAIRE=...), sinon le parseur .properties
#                 ne garde que le premier mot comme cle (espace = separateur
#                 cle/valeur par defaut). Les espaces dans les VALEURS n'ont pas
#                 besoin d'etre echappes (ex. "LETTER OF CREDIT" ci-dessous).
#   - valeurs   : termes vers lesquels enrichir la recherche - noms de table T24
#                 (ex. CUSTOMER, AA.ARR.CHARGEOFF), noms de colonne (ex.
#                 CUSTOMER.CIN), ou termes metier intermediaires.
#
# Fichier volontairement independant du code Java : pour ajouter un synonyme,
# il suffit d'ajouter/modifier une ligne ici, aucune recompilation necessaire
# au sens metier (juste un redemarrage de l'application pour le recharger).
# Note technique : ce fichier .properties n'accepte pas nativement les
# caracteres accentues sans echappement unicode ; les cles/valeurs sont donc
# ecrites sans accents (la comparaison cote Java normalise aussi les accents
# de la question posee, donc "identite"/"identité" sont equivalents en pratique).
# ============================================================================

KYC=IDENTITE,IDENTIFICATION,VERIFICATION,CLIENT,CUSTOMER

CIN=CUSTOMER.CIN,CARTE IDENTITE,PIECE IDENTITE,CUSTOMER

IDENTITE=CUSTOMER.CIN,CUSTOMER

CLIENT=CUSTOMER

CUSTOMER=CLIENT

COMPTE=ACCOUNT,AC,ACCOUNTS

ACCOUNT=COMPTE,AC,ACCOUNTS

ACCOUNTS=COMPTE,ACCOUNT,AC

AC=ACCOUNT,COMPTE,ACCOUNTS

COORDONNEES=CUSTOMER

ADRESSE=CUSTOMER

CHARGEOFF=AA.ARR.CHARGEOFF

CHARGE-OFF=AA.ARR.CHARGEOFF

# Modules prioritaires (BIAT Data Assistant) : AC (Accounts), LD (Loans & Deposits),
# LC (Letters of Credit), TT (Teller), EB (fonctions transverses T24), DE (Delivery),
# MD (Miscellaneous Deals) - noms verifies dans l'index documentaire le 2026-10-02 : 'teller' figure dans 20/20
# documents TT, 'delivery' dans 45 documents DE, 'miscellaneous deal' dans MD ; les anciennes expansions
# (telegraphic/funds transfer, data exchange, money market, electronic banking) n'y figuraient JAMAIS et
# eloignaient l'embedding des bons documents. EB n'a pas de nom unique dans la documentation : pas d'expansion.
# Expansion vers le nom complet du produit T24 (utile a la recherche
# semantique par embedding, cf. QueryAnalysis.getEnrichedQueryForEmbedding) et vers les termes
# metier/langage courant equivalents, dans les deux sens (prets code -> terme, terme -> code) -
# y compris pour un code de module seul (2 lettres), trop court pour etre extrait comme
# mot-cle syntaxique par TableKeywordExtractor mais detecte ici via SynonymDictionary.

PRET=LOAN,FINANCEMENT,CREDIT,LD,LOANS AND DEPOSITS

LOAN=PRET,FINANCEMENT,CREDIT,LD,LOANS AND DEPOSITS

LD=LOAN,PRET,FINANCEMENT,CREDIT,LOANS AND DEPOSITS

FINANCEMENT=PRET,LOAN,CREDIT,LD,LOANS AND DEPOSITS

# "credit" seul (financement, module LD) est volontairement distinct de "credit documentaire"
# (lettre de credit, module LC) ci-dessous : les deux cles peuvent matcher ensemble sur une
# phrase contenant "credit documentaire" (le mot "credit" y est aussi present), ce qui enrichit
# la recherche vers LD en plus de LC pour ce cas precis - compromis mineur assume, conforme a la
# distinction demandee entre "credit" (LD) et "credit documentaire"/"lettre de credit" (LC).
CREDIT=PRET,LOAN,FINANCEMENT,LD,LOANS AND DEPOSITS

CREDIT\ DOCUMENTAIRE=LC,L/C,LETTER OF CREDIT,LETTRE DE CREDIT

LETTRE\ DE\ CREDIT=LC,L/C,CREDIT DOCUMENTAIRE,LETTER OF CREDIT

LC=CREDIT DOCUMENTAIRE,LETTRE DE CREDIT,LETTER OF CREDIT,L/C

L/C=LC,CREDIT DOCUMENTAIRE,LETTRE DE CREDIT,LETTER OF CREDIT

TRANSFERT=FUNDS TRANSFER,TRANSFER

VIREMENT=FUNDS TRANSFER,TRANSFER

TT=TELLER,GUICHET,CAISSE

# (BANQUE ELECTRONIQUE / ELECTRONIC BANKING : retires, absents de la documentation et sans lien avec EB)





# (ECHANGE DE DONNEES / DATA EXCHANGE : retires, absents de la documentation, DE = Delivery)



DE=DELIVERY,LIVRAISON

# (MARCHE MONETAIRE / MONEY MARKET : retires, absents de la documentation, MD = Miscellaneous Deals)



MD=MISCELLANEOUS DEALS,DEAL

DEVISE=CURRENCY

CURRENCY=DEVISE

COMMISSION=CHARGE,FEE

CHARGE=COMMISSION,FEE

FEE=COMMISSION,CHARGE

TAUX=RATE

RATE=TAUX

ECHEANCE=MATURITY

MATURITY=ECHEANCE

ENGAGEMENT=COMMITMENT

COMMITMENT=ENGAGEMENT

# Abreviations courantes en anglais bancaire (cf. persona du prompt, ChatbotServiceImpl.buildPrompt).

CUST=CUSTOMER

ACCT=ACCOUNT,AC

ACC=ACCOUNT,AC

BAL=BALANCE

AMT=AMOUNT

FX=FOREIGN EXCHANGE,CURRENCY

DEAL=CONTRAT

CONTRAT=DEAL

DEPOT=DEPOSIT,LD,LOANS AND DEPOSITS

DEPOSIT=DEPOT,LD,LOANS AND DEPOSITS

# Recherche inverse de champ (FieldSearchService) : variantes d'un meme concept. Ce sont des TERMES
# a rechercher dans les noms/descriptions de champs, jamais des noms de champ supposes.
SWIFT=BIC,BANK IDENTIFIER CODE
BIC=SWIFT,BANK IDENTIFIER CODE
